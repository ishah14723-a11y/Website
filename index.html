<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="A little hello from Isha.">
  <title>Hello, Isha!</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(ellipse at 15% 15%, #263c61 0, transparent 42%), radial-gradient(ellipse at 85% 85%, #244c48 0, transparent 38%), #101827; }
    main { width: min(100%, 620px); padding: clamp(32px, 8vw, 64px); text-align: center; border: 1px solid rgba(255,255,255,.14); border-radius: 28px; background: rgba(255,255,255,.07); box-shadow: 0 24px 80px rgba(0,0,0,.28); backdrop-filter: blur(14px); }
    .wave { font-size: clamp(48px, 10vw, 76px); line-height: 1.2; }
    h1 { margin: 18px 0 12px; font-size: clamp(38px, 8vw, 60px); letter-spacing: -.055em; }
    p { margin: 0; color: #c4cfdf; font-size: 17px; line-height: 1.7; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 30px; padding: 9px 14px; border: 1px solid rgba(110,231,183,.25); border-radius: 999px; color: #a7f3d0; background: rgba(16,185,129,.1); font-size: 13px; font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 12px #34d399; }
    footer { margin-top: 34px; color: #8190a6; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="wave" aria-hidden="true">👋</div>
    <h1>Hello, Isha!</h1>
    <p>A little corner of the internet saying hello to you.<br>Thanks for stopping by.</p>
    <div class="status"><span class="dot"></span> Up and running</div>
    <footer>Made with a little bit of code ✨</footer>
  </main>
</body>
</html>
